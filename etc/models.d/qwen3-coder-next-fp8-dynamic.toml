# Example declaration tuned and measured on an NVIDIA DGX Spark.
# Review model-specific flags against your checkpoint revision.

engine = "vllm-docker"
image = "nvcr.io/nvidia/vllm:26.06-py3"

weights = "/models/Qwen3-Coder-Next-FP8-Dynamic"

served_name = "qwen3-coder-next-fp8"

gpu_memory_utilization = 0.85
max_model_len = 262144

est_weights_gib = 80

extra_flags = [
  "--tensor-parallel-size", "1",
  "--trust-remote-code",
  "--kv-cache-dtype", "fp8",
  "--attention-backend", "flashinfer",
  "--max-num-seqs", "6",
  "--max-num-batched-tokens", "8192",
  "--enable-chunked-prefill",
  "--async-scheduling",
  "--enable-prefix-caching",
  "--load-format", "fastsafetensors",
  "--override-generation-config", '{"min_p":0.01}',
  "--tool-call-parser", "qwen3_coder",
  "--enable-auto-tool-choice",
]
