# Example declaration tuned and measured on an NVIDIA DGX Spark.
# Review model-specific flags against your checkpoint revision.

engine = "vllm-docker"
image = "nvcr.io/nvidia/vllm:26.06-py3"
weights = "/models/Qwen3.6-35B-A3B-NVFP4-unsloth"
served_name = "qwen3.6-35b-a3b-nvfp4-unsloth"
gpu_memory_utilization = 0.3
max_model_len = 262144
est_weights_gb = 27
extra_flags = [
  "--trust-remote-code",
  "--reasoning-parser", "qwen3",
  "--tool-call-parser", "qwen3_xml",
  "--enable-auto-tool-choice",
]
